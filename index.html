<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Timeless songs of grace, with the stories and Scripture behind them.">
    <meta name="theme-color" id="theme-color" content="#f3eee4">
    <meta name="color-scheme" content="light dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Hark">
    <title>Hark</title>
    <link rel="alternate" type="application/rss+xml" title="Hark" href="feed.xml">
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("hark-theme");
          var theme = stored === "light" || stored === "dark"
            ? stored
            : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.themeChoice = stored ? "set" : "system";
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        var standalone = matchMedia("(display-mode: standalone)").matches
          || matchMedia("(display-mode: fullscreen)").matches
          || window.navigator.standalone === true;
        if (standalone) document.documentElement.dataset.installed = "true";
      })();
    </script>
    <script id="entry-script">
      // Decides, once and before the first paint, what a visit to the bare
      // address opens on. The installed app and anyone who has used Hark
      // before go straight to the hymns. A first visit opens on the welcome
      // page, and keeps doing so until that reader opens a hymn.
      (function () {
        var root = document.documentElement;
        var returning = false;
        var newcomer = false;
        try {
          returning = localStorage.getItem("hark-returning") === "1";
          newcomer = localStorage.getItem("hark-newcomer") === "1";
        } catch (e) {}
        // A worker already running this page means Hark was open here before
        // the welcome page existed, unless this browser was marked a newcomer.
        var worker = "serviceWorker" in navigator && Boolean(navigator.serviceWorker.controller);
        var entry = "welcome";
        var mark = "";
        if (returning) entry = "hymns";
        else if (root.dataset.installed === "true" || (worker && !newcomer)) {
          entry = "hymns";
          mark = "hark-returning";
        } else if (!newcomer) mark = "hark-newcomer";
        if (mark) {
          try {
            localStorage.setItem(mark, "1");
          } catch (e) {}
        }
        root.dataset.entry = entry;
        var hash = location.hash;
        var bare = hash === "" || hash === "#";
        if (hash === "#/welcome" || (bare && entry === "welcome")) root.dataset.view = "welcome";
      })();
    </script>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="preload" href="fonts/newsreader-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/newsreader-600.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <a class="skip" href="#main">Skip to the songs</a>
    <div class="app">
      <header class="top" id="home-bar">
        <div class="brand-row">
          <div class="brand">
            <h1><a class="brand-home" href="#/" aria-label="Hark home">Hark</a></h1>
            <p class="eyebrow">Timeless songs of grace</p>
          </div>
          <div class="header-tools">
            <button type="button" class="notify-link" id="notify-link" aria-pressed="false">Notify me</button>
            <a class="install-link" id="install-link" href="#/install">Install Hark</a>
            <button type="button" class="icon-btn" id="theme-home" aria-label="Switch to dark mode"></button>
          </div>
        </div>
        <form class="search" id="search-form" role="search">
          <label class="visually-hidden" for="q">Search by number, title, or a line</label>
          <input id="q" type="search" placeholder="Number, title, or a line" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
          <button type="button" class="icon-btn clear" id="clear" hidden aria-label="Clear search"></button>
        </form>
        <div class="chips" id="chips" role="toolbar" aria-label="Filter by section"></div>
        <div class="tabs" id="tabs" role="tablist" aria-label="Browse">
          <button type="button" role="tab" id="tab-number" aria-controls="main" aria-selected="true">Number</button>
          <button type="button" role="tab" id="tab-title" aria-controls="main" aria-selected="false" tabindex="-1">Title</button>
          <button type="button" role="tab" id="tab-author" aria-controls="main" aria-selected="false" tabindex="-1">Author</button>
          <button type="button" role="tab" id="tab-liked" aria-controls="main" aria-selected="false" tabindex="-1">Liked</button>
          <button type="button" role="tab" id="tab-themes" aria-controls="main" aria-selected="false" tabindex="-1">Themes</button>
          <button type="button" role="tab" id="tab-sins" aria-controls="main" aria-selected="false" tabindex="-1">Sins</button>
          <button type="button" role="tab" id="tab-requests" aria-controls="main" aria-selected="false" tabindex="-1">Comments/Requests</button>
        </div>
        <div class="count-row" id="count-row">
          <p class="count" id="count" aria-live="polite"></p>
          <span class="home-links">
            <a class="about-link" id="whats-new-link" href="#/whats-new">What's New</a>
            <a class="about-link" id="about-link" href="#/welcome">About Hark</a>
          </span>
        </div>
      </header>

      <header class="hymn-bar" id="hymn-bar" hidden>
        <a class="text-btn" id="back-link" href="#/">Songs</a>
        <a class="brand-home" href="#/" aria-label="Hark home">Hark</a>
        <div class="pager">
          <a class="icon-btn" id="prev-link" href="#/" aria-label="Previous hymn"></a>
          <p class="pager-num" id="pager-num"></p>
          <a class="icon-btn" id="next-link" href="#/" aria-label="Next hymn"></a>
        </div>
        <button type="button" class="icon-btn" id="theme-hymn" aria-label="Switch to dark mode"></button>
      </header>

      <main id="main" tabindex="-1">
        <p class="empty">Opening the songbook...</p>
      </main>
    </div>
    <div class="jump-bubble" id="jump-bubble" hidden aria-hidden="true"></div>
    <dialog class="install-help" id="install-help" aria-labelledby="install-help-title"></dialog>
    <!-- Outside #main on purpose. Opening another page replaces #main and leaves this player where it is. -->
    <div class="song-bar" id="song-bar" hidden>
      <div class="song-bar-video"><div id="song-player-host"></div></div>
      <div class="song-bar-main">
        <button type="button" class="song-bar-title" id="song-bar-title"></button>
        <div class="song-bar-controls">
          <button type="button" id="song-prev" class="song-icon" aria-label="Previous song"></button>
          <button type="button" id="song-toggle" class="song-icon" aria-label="Pause"></button>
          <button type="button" id="song-next" aria-label="Play next song">Play next song</button>
          <button type="button" id="song-stop" class="song-icon" aria-label="Stop"></button>
        </div>
        <button type="button" class="song-keep" id="song-keep" hidden>Keep watching the service</button>
      </div>
    </div>
    <noscript>
      <p class="notice">Hark needs JavaScript to open the songbook.</p>
    </noscript>
    <!-- abcjs is loaded by app.js when someone opens the music on a hymn. -->
    <script type="module" src="app.js"></script>
  </body>
</html>
