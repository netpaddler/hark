name = "hark-requests"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
REPO = "netpaddler/hark"
LABEL = "hymn-request"
ALLOWED_ORIGIN = "https://netpaddler.github.io"

# The rate limit counts only what one isolate saw until this is bound to a real
# namespace, so a caller who lands on a fresh isolate starts over. To make the
# count shared, run:
#
#   npx wrangler kv namespace create hark-rate-limit
#
# then put the id it prints below and uncomment all three lines.
#
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "put-the-id-here"
