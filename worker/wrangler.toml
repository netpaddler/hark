name = "hark-requests"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
REPO = "netpaddler/hark"
LABEL = "hymn-request"
ALLOWED_ORIGIN = "https://netpaddler.github.io"

# The hark-rate-limit namespace exists, and the live Worker is already bound to it.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "4d08aacef7c848f88fd1cee2c85e617e"
