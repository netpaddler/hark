name = "hark-requests"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
REPO = "netpaddler/hark"
LABEL = "hymn-request"
# The site is moving from hymns.theweightofglory.com to
# hark.theweightofglory.com. Both stay allowed until the old name is gone.
# The github.io address redirects there, so it should not normally appear as
# an Origin, but it costs nothing to keep while anything still points at it.
ALLOWED_ORIGIN = "https://hark.theweightofglory.com,https://hymns.theweightofglory.com,https://netpaddler.github.io"
# Public half of the VAPID key. The private half is the VAPID_PRIVATE_JWK secret.
VAPID_PUBLIC_KEY = "BOv3KiVHSNSaOXPjN87gZnLI7H3PZ8hd6VT2re5-iO0qyMrNsG4ogBp0S_-at0_GRa1ql1nNRvh2BGWNxEbZVMw"
VAPID_SUBJECT = "mailto:netpaddler@gmail.com"

# The hark-rate-limit namespace exists, and the live Worker is already bound to it.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "4d08aacef7c848f88fd1cee2c85e617e"

# Subscriptions only. Hymn text is not stored here.
[[kv_namespaces]]
binding = "PUSH_SUBSCRIPTIONS"
id = "5f3c756101f94303acc4b7a0f5749018"

# Listening stats. Apply worker/schema.sql if the tables are not already there.
# npx wrangler secret put LISTEN_STATS_KEY
[[d1_databases]]
binding = "LISTEN"
database_name = "hark-listen"
database_id = "e252ef37-1854-4037-a793-7f70506ccfea"
