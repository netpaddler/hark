name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: node --test test/hymns.test.js test/player-nav.test.js test/seo.test.js

  deploy:
    needs: test
    # A pull request runs the tests above and stops there. Only main deploys.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the RSS feed
        run: node scripts/build-feed.mjs

      - name: Build the hymn pages, sitemap, and robots.txt
        run: node scripts/build-seo.mjs

      - name: Collect site files
        run: |
          mkdir _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'test' \
            --exclude 'scripts' \
            ./ _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Tell subscribers about new hymns
        env:
          PUSH_NOTIFY_SECRET: ${{ secrets.PUSH_NOTIFY_SECRET }}
          PUSH_NOTIFY_URL: https://hark-requests.netpaddler.workers.dev/notify
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$GITHUB_EVENT_BEFORE" ] && [ "$GITHUB_EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --depth=1 origin "$GITHUB_EVENT_BEFORE" || true
          fi
          node scripts/notify-push.mjs
